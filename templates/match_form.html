{% extends "base.html" %}
{% block title %}Log Match - {{ player.name }}{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full block">
    <div class="bg-white shadow px-4 py-5 sm:rounded-lg sm:p-6 mb-10 border border-gray-200">
        <h3 class="text-lg leading-6 font-medium text-gray-900 mb-6 border-b pb-2">Log Match for {{ player.name }}</h3>
        
        <form action="{{ url_for('add_match', player_id=player.id) }}" method="POST" class="space-y-6">
            
            <div class="grid grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Date</label>
                    <input type="date" name="match_date" required class="mt-1 focus:ring-indigo-500 focus:border-indigo-500 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md py-2 px-3 border">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Opponent Team</label>
                    <input type="text" name="opponent" required class="mt-1 focus:ring-indigo-500 focus:border-indigo-500 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md py-2 px-3 border">
                </div>
            </div>

            <div class="border-t border-gray-200 pt-6">
                <h4 class="text-sm font-bold text-indigo-700 uppercase tracking-wide mb-4">Batting Performance</h4>
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-700">Runs Scored</label>
                        <input type="number" name="runs" value="0" class="mt-1 focus:ring-indigo-500 focus:border-indigo-500 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md py-2 px-3 border bg-gray-50">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700">Balls Faced</label>
                        <input type="number" name="balls_faced" value="0" class="mt-1 focus:ring-indigo-500 focus:border-indigo-500 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md py-2 px-3 border bg-gray-50">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700">Fours</label>
                        <input type="number" name="fours" value="0" class="mt-1 focus:ring-indigo-500 focus:border-indigo-500 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md py-2 px-3 border bg-gray-50">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700">Sixes</label>
                        <input type="number" name="sixes" value="0" class="mt-1 focus:ring-indigo-500 focus:border-indigo-500 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md py-2 px-3 border bg-gray-50">
                    </div>
                </div>
            </div>

            <div class="border-t border-gray-200 pt-6">
                <h4 class="text-sm font-bold text-red-700 uppercase tracking-wide mb-4">Bowling Performance</h4>
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-700">Overs Bowled (e.g. 3.4)</label>
                        <input type="number" step="0.1" name="overs_bowled" value="0" class="mt-1 focus:ring-indigo-500 focus:border-indigo-500 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md py-2 px-3 border bg-gray-50">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700">Maidens</label>
                        <input type="number" name="maidens" value="0" class="mt-1 focus:ring-indigo-500 focus:border-indigo-500 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md py-2 px-3 border bg-gray-50">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700">Runs Conceded</label>
                        <input type="number" name="runs_conceded" value="0" class="mt-1 focus:ring-indigo-500 focus:border-indigo-500 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md py-2 px-3 border bg-gray-50">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700">Wickets</label>
                        <input type="number" name="wickets" value="0" class="mt-1 focus:ring-indigo-500 focus:border-indigo-500 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md py-2 px-3 border bg-gray-50">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700">No Balls</label>
                        <input type="number" name="no_balls" value="0" class="mt-1 focus:ring-indigo-500 focus:border-indigo-500 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md py-2 px-3 border bg-gray-50">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700">Wides</label>
                        <input type="number" name="wides" value="0" class="mt-1 focus:ring-indigo-500 focus:border-indigo-500 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md py-2 px-3 border bg-gray-50">
                    </div>
                </div>
            </div>

            <div class="border-t border-gray-200 pt-6">
                <h4 class="text-sm font-bold text-green-700 uppercase tracking-wide mb-4">Fielding</h4>
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-700">Catches</label>
                        <input type="number" name="catches" value="0" class="mt-1 focus:ring-indigo-500 focus:border-indigo-500 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md py-2 px-3 border bg-gray-50">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700">Stumpings</label>
                        <input type="number" name="stumpings" value="0" class="mt-1 focus:ring-indigo-500 focus:border-indigo-500 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md py-2 px-3 border bg-gray-50">
                    </div>
                </div>
            </div>

            <div class="flex justify-end pt-6 border-t border-gray-200">
                <button type="submit" class="bg-indigo-600 border border-transparent rounded-md shadow-sm py-2 px-6 inline-flex justify-center text-sm font-medium text-white hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 w-full md:w-auto">
                    Save Match Record
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
