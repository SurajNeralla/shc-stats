{% extends "base.html" %}

{% block content %}
<style>
.coin-container {
    perspective: 1000px;
    margin: 40px auto;
    width: 200px;
    height: 200px;
}
.coin {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.coin-side {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    backface-visibility: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 80px;
    font-weight: 900;
    font-family: 'Lexend', sans-serif;
    color: #582103;
    text-shadow: 1px 1px 2px rgba(255,255,255,0.4), -1px -1px 2px rgba(0,0,0,0.5);
    background: radial-gradient(circle, #fcd34d 0%, #f59e0b 60%, #b45309 100%);
    border: 6px solid #fbbf24;
    box-shadow: 
        inset 0 0 15px rgba(255, 255, 255, 0.4), 
        inset 0 0 30px rgba(0, 0, 0, 0.5), 
        0 8px 25px rgba(0,0,0,0.6);
}
.coin-side::after {
    content: '';
    position: absolute;
    width: 90%;
    height: 90%;
    border-radius: 50%;
    border: 2px dashed rgba(180, 83, 9, 0.5);
    pointer-events: none;
}
.coin-heads {
    z-index: 2;
}
.coin-tails {
    transform: rotateY(180deg);
}
.coin-logo {
    width: 65%;
    height: 65%;
    object-fit: contain;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
}
.flip-heads { transform: rotateY(1800deg); }
.flip-tails { transform: rotateY(1980deg); }
</style>

<div class="max-w-3xl mx-auto px-4 py-8 w-full flex-grow flex flex-col items-center justify-center">
    
    <!-- Page Title -->
    <div class="mb-8 text-center">
        <div class="flex items-center justify-center gap-2 mb-1">
            <span class="w-8 h-1 bg-tertiary rounded-full"></span>
            <span class="font-headline font-bold uppercase tracking-[0.2em] text-[10px] text-tertiary">Match Initialization</span>
            <span class="w-8 h-1 bg-tertiary rounded-full"></span>
        </div>
        <h2 class="text-4xl font-headline font-black tracking-tight text-on-surface uppercase">THE TOSS</h2>
    </div>

    <div class="kinetic-gradient-border p-8 shadow-2xl w-full text-center relative overflow-hidden">
        <!-- Team Matchup -->
        <div class="bg-surface-container-low border border-outline-variant/20 rounded-2xl p-4 inline-flex items-center gap-4 mb-2">
            <span class="font-headline font-black text-secondary tracking-wider text-xl">{{ match.team_a_name }}</span>
            <span class="text-[10px] font-bold text-outline uppercase tracking-widest px-2 py-1 bg-surface-lowest rounded-md">VS</span>
            <span class="font-headline font-black text-error tracking-wider text-xl">{{ match.team_b_name }}</span>
        </div>
        
        <!-- Coin Animation -->
        <div class="coin-container">
            <div class="coin" id="coin">
                <div class="coin-side coin-heads">H</div>
                <div class="coin-side coin-tails">T</div>
            </div>
        </div>
        
        <!-- Action Button -->
        <button id="flipBtn" class="mt-4 px-10 py-5 bg-tertiary text-[#3d2b00] font-headline font-black text-xl uppercase tracking-widest rounded-[1.5rem] shadow-[0_10px_30px_rgba(255,209,112,0.4)] hover:scale-[1.05] active:scale-95 transition-all">
            INITIATE TOSS
        </button>
        
        <!-- Results Form (Hidden initially) -->
        <div id="tossResult" style="display:none;" class="mt-12 bg-surface-container border border-outline-variant/20 p-8 rounded-[1.5rem] shadow-inner text-left animate-[slideIn_0.5s_ease-out]">
            <div class="flex items-center gap-3 mb-6">
                <div class="bg-primary/10 p-2 rounded-lg">
                    <span class="material-symbols-outlined text-primary">gavel</span>
                </div>
                <h3 class="font-headline font-bold text-lg uppercase tracking-wider">Toss Decision Protocol</h3>
            </div>

            <form id="tossForm" class="space-y-6">
                <div class="flex flex-col gap-2">
                    <label for="winTeam" class="font-label text-xs uppercase font-bold text-on-surface-variant tracking-widest ml-1">Toss Winner</label>
                    <select id="winTeam" required class="bg-surface-bright border-none text-on-surface p-4 rounded-xl font-headline font-bold text-lg focus:ring-2 focus:ring-primary/50 transition-all appearance-none cursor-pointer">
                        <option value="" disabled selected>AWAITING SELECTION...</option>
                        <option value="team_a">{{ match.team_a_name }}</option>
                        <option value="team_b">{{ match.team_b_name }}</option>
                    </select>
                </div>
                
                <div class="flex flex-col gap-2">
                    <label for="winDecision" class="font-label text-xs uppercase font-bold text-on-surface-variant tracking-widest ml-1">Elected To</label>
                    <select id="winDecision" required class="bg-surface-bright border-none text-on-surface p-4 rounded-xl font-headline font-bold text-lg focus:ring-2 focus:ring-primary/50 transition-all appearance-none cursor-pointer">
                        <option value="" disabled selected>AWAITING DECISION...</option>
                        <option value="bat">BAT FIRST</option>
                        <option value="bowl">BOWL FIRST</option>
                    </select>
                </div>
                
                <p id="errorMsg" class="text-error font-bold text-xs uppercase tracking-wider hidden"></p>

                <button type="submit" class="w-full bg-primary text-on-primary font-headline font-black py-5 rounded-2xl text-lg uppercase tracking-widest shadow-[0_10px_30px_rgba(0,252,65,0.3)] hover:scale-[1.02] active:scale-95 transition-all mt-4 flex justify-center items-center gap-2">
                    <span class="material-symbols-outlined">play_arrow</span>
                    COMMENCE INNINGS
                </button>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('flipBtn').addEventListener('click', function() {
        this.disabled = true;
        this.classList.add('opacity-30', 'cursor-not-allowed');
        
        let coin = document.getElementById('coin');
        let isHeads = Math.random() < 0.5;
        
        coin.className = 'coin'; // reset
        setTimeout(() => {
            coin.classList.add(isHeads ? 'flip-heads' : 'flip-tails');
        }, 100);
        
        setTimeout(() => {
            const resultDiv = document.getElementById('tossResult');
            resultDiv.style.display = 'block';
            resultDiv.scrollIntoView({behavior: "smooth", block: "center"});
            
            // Trigger confetti with neon colors
            if (window.confetti) {
                confetti({ 
                    particleCount: 150, 
                    spread: 100, 
                    origin: { y: 0.6 },
                    colors: ['#00FC41', '#53a0ff', '#ffd170', '#ff7351']
                });
            }
        }, 3200);
    });
    
    document.getElementById('tossForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const payload = {
            toss_winner: document.getElementById('winTeam').value,
            toss_decision: document.getElementById('winDecision').value
        };
        
        try {
            let res = await fetch('/api/live-match/{{ match.id }}/toss', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            let data = await res.json();
            
            if (res.ok) {
                window.location.href = '/live-match/{{ match.id }}/scorecard';
            } else {
                let err = document.getElementById('errorMsg');
                err.innerText = data.error || 'SERVER ERROR';
                err.classList.remove('hidden');
            }
        } catch (e) {
            let err = document.getElementById('errorMsg');
            err.innerText = "NETWORK ERROR";
            err.classList.remove('hidden');
        }
    });
});
</script>
{% endblock %}
