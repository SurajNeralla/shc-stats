{% extends "base.html" %}

{% block title %}Login — SHC STATS{% endblock %}

{% block content %}
<div class="flex-grow flex items-center justify-center py-12 px-4">
    <div class="max-w-md w-full space-y-8">
        <!-- Logo -->
        <div class="text-center">
            <h1 class="text-3xl font-black italic text-[#00FC41] tracking-widest font-headline mb-2">SHC STATS</h1>
            <div class="flex items-center justify-center gap-2 mb-4">
                <span class="w-8 h-1 bg-primary rounded-full"></span>
                <span class="font-headline font-bold uppercase tracking-[0.2em] text-xs text-primary">Authentication</span>
                <span class="w-8 h-1 bg-primary rounded-full"></span>
            </div>
            <h2 class="text-4xl font-headline font-black tracking-tight text-on-surface">SIGN IN</h2>
            <p class="mt-3 text-sm text-on-surface-variant">Access your stats or manage the league</p>
        </div>

        <!-- Login Card -->
        <div class="kinetic-gradient-border p-8 shadow-2xl">
            <form class="space-y-6" action="{{ url_for('login') }}" method="POST">
                <div class="space-y-4">
                    <div class="flex flex-col gap-2">
                        <label for="email" class="font-label text-xs uppercase font-bold text-on-surface-variant tracking-widest ml-1">Email</label>
                        <input id="email" name="email" type="email" autocomplete="email" required 
                            class="bg-surface-bright border-none text-on-surface p-4 rounded-xl font-medium focus:ring-2 focus:ring-primary/50 transition-all placeholder:text-outline/50" 
                            placeholder="your@email.com">
                    </div>
                    <div class="flex flex-col gap-2">
                        <label for="password" class="font-label text-xs uppercase font-bold text-on-surface-variant tracking-widest ml-1">Password</label>
                        <input id="password" name="password" type="password" autocomplete="current-password" required 
                            class="bg-surface-bright border-none text-on-surface p-4 rounded-xl font-medium focus:ring-2 focus:ring-primary/50 transition-all placeholder:text-outline/50" 
                            placeholder="••••••••">
                    </div>
                    <div class="flex flex-col gap-2">
                        <label for="account_type" class="font-label text-xs uppercase font-bold text-on-surface-variant tracking-widest ml-1">Account Type</label>
                        <select id="account_type" name="account_type" 
                            class="bg-surface-bright border-none text-on-surface p-4 rounded-xl font-medium focus:ring-2 focus:ring-primary/50 transition-all appearance-none cursor-pointer">
                            <option value="player">PLAYER</option>
                            <option value="admin">ADMIN</option>
                        </select>
                    </div>

                    <div class="flex items-center gap-3 ml-2 mt-4">
                        <input id="remember" name="remember" type="checkbox" 
                            class="w-5 h-5 text-primary bg-surface-bright border-none rounded-md focus:ring-2 focus:ring-primary/50 transition-all cursor-pointer">
                        <label for="remember" class="font-label text-sm uppercase font-bold text-on-surface-variant cursor-pointer select-none">Remember Me</label>
                    </div>
                </div>

                <button type="submit" 
                    class="w-full bg-primary text-on-primary font-headline font-black py-4 rounded-2xl text-lg uppercase tracking-widest shadow-[0_10px_30px_rgba(0,252,65,0.3)] hover:scale-[1.02] active:scale-95 transition-all mt-4">
                    AUTHENTICATE
                </button>

                <p class="text-center text-on-surface-variant text-[10px] mt-4 uppercase tracking-[0.15em]">Made by Suraj Neralla</p>
            </form>
        </div>
    </div>
</div>
{% endblock %}
