{% extends "base.html" %}

{% block title %}Logout — SHC STATS{% endblock %}

{% block content %}
<div class="flex-grow flex items-center justify-center py-12 px-4">
    <div class="max-w-md w-full space-y-8">
        <!-- Logo Header -->
        <div class="text-center">
            <h1 class="text-3xl font-black italic text-[#00FC41] tracking-widest font-headline mb-2">SHC STATS</h1>
            <div class="flex items-center justify-center gap-2 mb-4">
                <span class="w-8 h-1 bg-error rounded-full"></span>
                <span class="font-headline font-bold uppercase tracking-[0.2em] text-xs text-error">Logout</span>
                <span class="w-8 h-1 bg-error rounded-full"></span>
            </div>
            <h2 class="text-4xl font-headline font-black tracking-tight text-on-surface">LEAVING?</h2>
            <p class="mt-3 text-sm text-on-surface-variant">Are you sure you want to log out of your account?</p>
        </div>

        <!-- Logout Card -->
        <div class="kinetic-card p-8 text-center border overflow-hidden relative" style="border-color: rgba(255, 115, 81, 0.3);">
            <div class="absolute inset-x-0 top-0 h-1 bg-gradient-to-r from-transparent via-[#ff7351] to-transparent opacity-50"></div>
            
            <form action="{{ url_for('logout') }}" method="POST" class="space-y-6">
                <div class="flex flex-col gap-4">
                    <button type="submit" class="w-full bg-error text-white font-headline font-black py-4 rounded-2xl text-lg uppercase tracking-widest shadow-[0_10px_30px_rgba(255,115,81,0.2)] hover:scale-[1.02] active:scale-95 transition-all">
                        CONFIRM LOGOUT
                    </button>
                    
                    <a href="javascript:history.back()" class="w-full bg-surface-bright text-on-surface font-headline font-bold py-4 rounded-2xl text-sm uppercase tracking-widest hover:bg-surface-variant hover:scale-[1.02] active:scale-95 transition-all inline-block">
                        CANCEL
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
